<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1600px;height:800px;background:#141416;font-family:-apple-system,"SF Pro Display","Segoe UI",Inter,sans-serif;color:#e5e5e7;overflow:hidden}
.wrap{position:relative;width:1600px;height:800px;display:flex;align-items:center;justify-content:center;gap:88px;
 background:radial-gradient(900px 520px at 30% 50%,rgba(224,57,62,.22),transparent 65%),radial-gradient(700px 500px at 78% 40%,rgba(255,255,255,.05),transparent 60%),#141416}

.text{display:flex;flex-direction:column;gap:18px;max-width:760px}
h1{margin:0;font-size:132px;letter-spacing:-.04em;font-weight:700;line-height:1;color:#fff}

p.tag{margin:0;font-size:40px;font-weight:500;color:#cfcfd3;letter-spacing:-.01em}
p.sub{margin:6px 0 0;font-size:24px;color:#8e8e93;line-height:1.45}
.pills{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap}
.pill{border:1px solid #3a3a3d;border-radius:999px;padding:8px 16px;font-size:19px;color:#b9b9be;background:rgba(255,255,255,.03)}
</style></head><body><div class="wrap">

 <div class="dl"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12"/><path d="m7 11 5 5 5-5"/><path d="M5 20h14"/></svg></div></div>
